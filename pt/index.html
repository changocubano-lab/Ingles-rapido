<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inglês rápido</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#b4461b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Inglês">
<style>
:root{--bg:#faf8f4;--card:#fff;--ink:#1d1b18;--muted:#6b665d;--line:#e7e2d8;--accent:#b4461b;--accent-soft:#fbe9df;--ok:#2f7a3d;--ok-soft:#e3f2e5;--bad:#b3261e;--bad-soft:#fbe3e1}
@media (prefers-color-scheme:dark){:root{--bg:#171513;--card:#211e1b;--ink:#f2eee8;--muted:#a59f94;--line:#35312c;--accent:#f08a5d;--accent-soft:#3a271e;--ok:#7fcf8d;--ok-soft:#1f3323;--bad:#f2867e;--bad-soft:#3a1f1d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px 0}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{color:var(--muted);font-size:14px;margin:0 0 10px}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:none;white-space:nowrap;font-size:15px;padding-left:12px!important;padding-right:12px!important;border:0;background:none;color:var(--muted);padding:10px 4px 12px;font:inherit;font-weight:600;border-bottom:3px solid transparent;cursor:pointer}
nav button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
main{padding:14px 16px 60px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.chips button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.card .txt{flex:1;min-width:0}
.en{font-weight:650;font-size:17px}
.pr{color:var(--accent);font-size:16px;margin-top:2px}
.tr{color:var(--muted);font-size:14px;margin-top:2px}
.who{font-weight:700;color:var(--muted);width:20px;flex:none;text-align:center}
.btns{display:flex;gap:6px;flex:none}
.play{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--accent-soft);color:var(--accent);font-size:18px;cursor:pointer;display:grid;place-items:center}
.play.slow{background:var(--card);font-size:16px}
.play:active{transform:scale(.94)}
.note{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;color:var(--muted);font-size:14px;margin-bottom:12px}
.playall{width:100%;margin:2px 0 12px;padding:10px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
h2{font-size:17px;margin:18px 0 8px}
.quiz{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.qhead{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-bottom:10px}
.qen{font-size:22px;font-weight:700;margin:6px 0 2px}
.opts{display:grid;gap:8px;margin-top:14px}
.opts button{text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.opts button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.opts button.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.fb{min-height:24px;margin-top:10px;font-weight:600}
.next{margin-top:8px;width:100%;padding:12px;border-radius:12px;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.row{display:flex;gap:8px;align-items:center}
.modes{display:flex;gap:6px;margin-bottom:12px}
.modes button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.modes button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);font-weight:600;background:var(--accent-soft)}
.hidden{display:none}
.pic{width:96px;flex:none;border-radius:10px;background:#fff;overflow:hidden}.pic svg{width:100%;height:auto;display:block}
.tree{max-width:330px;margin:4px auto 14px;background:#fff;border-radius:14px;border:1px solid var(--line);padding:6px}.tree svg{width:100%;height:auto;display:block}
.qpic{max-width:190px;margin:10px auto 0;background:#fff;border-radius:12px;padding:4px}.qpic svg{width:100%;height:auto;display:block}
.lcard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;font:inherit;color:var(--ink);cursor:pointer}
.lcard .n{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}.lcard b{display:block;font-size:17px;margin:2px 0 8px}
.lcard .prog{margin:0}.lcard.done{border-color:var(--ok)}.lcard.done .n{color:var(--ok)}
.dots{display:flex;gap:5px;margin:4px 0 12px}.dots i{flex:1;height:6px;border-radius:9px;background:var(--line)}.dots i.on{background:var(--accent)}.dots i.cur{background:var(--accent);opacity:.45}
.lnote{background:var(--card);border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:15px}
.bad{color:var(--bad);text-decoration:line-through;font-size:14px;margin-top:2px}
.tipl{margin:0;padding-left:18px}.tipl li{margin:6px 0}
.docs{display:block;margin-top:16px;padding:14px;border-radius:14px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink);text-decoration:none}.docs b{display:block;color:var(--accent);margin-bottom:2px}.docs span{font-size:14px;color:var(--muted)}
.inp{display:flex;gap:8px;margin:4px 0 10px}.inp input{flex:1;min-width:0;font:inherit;font-size:18px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.inp button{border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-weight:700;padding:0 16px;cursor:pointer}
.res{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.res .big2{font-size:26px;font-weight:700;color:var(--accent);margin:2px 0 8px;word-break:break-word}
.chunks{display:grid;gap:6px;margin-top:10px}
.ck{display:grid;grid-template-columns:auto auto 1fr;gap:4px 10px;align-items:baseline;padding:8px 10px;border-radius:10px;background:var(--bg)}
.ck b{font-size:18px}.ck .s{color:var(--accent);font-weight:650}.ck .t{grid-column:1/-1;color:var(--muted);font-size:13px}
.nw{display:inline-block;margin-top:4px;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:3px 9px;border:0;cursor:pointer}
.irr{background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:8px 10px;font-size:14px;font-weight:600;margin-top:8px}
.snd{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.snd.easy{border-style:dashed}.snd h3{margin:0 0 4px;font-size:17px}.snd p{margin:0 0 8px;color:var(--muted);font-size:15px}
.exs{display:flex;flex-wrap:wrap;gap:6px}.ex{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:5px 10px 5px 6px;background:var(--bg);font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.ex i{font-style:normal;color:var(--accent)}.badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ok)}
.flash{animation:fl 1.2s}@keyframes fl{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:none}}
.prog{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.day{aspect-ratio:1;width:100%;min-width:0;padding:0;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;display:grid;place-items:center;position:relative}
.day.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.day.rev{border-style:dashed}
.day.next{border:2px solid var(--accent);color:var(--accent)}
.big{width:100%;padding:14px;border-radius:12px;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:17px;cursor:pointer;margin:6px 0 16px}
.ghost{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:6px 0;margin-bottom:6px}
.step{color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin:4px 0 6px}
.said{border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:99px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;margin-top:6px}
.said[aria-pressed=true]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600}
.challenge{background:var(--accent-soft);border-radius:14px;padding:14px;margin:12px 0}
.legend{color:var(--muted);font-size:13px;margin-top:10px}
</style>
</head>

  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>
  <div class="seg" role="group" aria-label="Idioma / Idioma">

    <button id="lang-pt" aria-pressed="false">🇧🇷 Português</button>

    <button role="tab" data-tab="sounds" aria-selected="false" id="tab-sounds"></button>
    <button role="tab" data-tab="phrases" aria-selected="false" id="tab-phrases"></button>

</div></header>

  <div id="noaudio" class="note hidden"></div>
  <section id="view-course"></section>
  <section id="view-lessons" class="hidden"></section>
  <section id="view-read" class="hidden"></section>
  <section id="view-sounds" class="hidden"></section>
  <section id="view-phrases" class="hidden">
    <div class="chips" id="cats"></div>
    <div id="list"></div>
  </section>
  <section id="view-dialogs" class="hidden">
    <div class="chips" id="dcats"></div>
    <div id="dlist"></div>
  </section>
  <section id="view-quiz" class="hidden">
    <div class="modes" id="modes"></div>
    <div class="quiz" id="quiz"></div>
  </section>
</main>

let lang="es", tab="course", cat=0, dcat=0, mode=1, score=0, total=0, cur=null;
try{const s=localStorage.getItem("ef-lang"); if(s==="pt"||s==="es") lang=s;}catch(e){}
let locked="pt"; lang="pt";
function readHash(){ return; const h=(location.hash||"").replace("#",""); locked=(h==="espanol"||h==="es")?"es":(h==="portugues"||h==="pt")?"pt":null; if(locked) lang=locked; }
readHash();
const $=id=>document.getElementById(id);
const synth = window.speechSynthesis;
let voice=null;
function pickVoice(){ if(!synth) return; const v=synth.getVoices(); voice=v.find(x=>x.lang==="en-US"&&/Samantha|Google US|Aria|Jenny/i.test(x.name))||v.find(x=>x.lang==="en-US")||v.find(x=>x.lang&&x.lang.startsWith("en"))||null; }
if(synth){pickVoice(); synth.onvoiceschanged=pickVoice;}
function clean(t){return t.replace(/\.\.\./g," ").replace(/\s\/\s/g,", ").replace(/\(.*?\)/g,"");}
function speak(t,rate,onend){
  if(!synth){$("noaudio").classList.remove("hidden");return;}
  try{synth.cancel(); const u=new SpeechSynthesisUtterance(clean(t)); u.lang="en-US"; if(voice) u.voice=voice; u.rate=rate||0.9; if(onend) u.onend=onend; synth.speak(u);}catch(e){$("noaudio").classList.remove("hidden");}
}
function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
function card(r,who,extra){
  return `<div class="card">${who?`<div class="who">${esc(who)}</div>`:""}${r.img&&typeof IMGS!=="undefined"&&IMGS[r.img]?`<div class="pic">${IMGS[r.img]}</div>`:""}<div class="txt"><div class="en">${esc(r.en)}</div><div class="pr">${esc(r.pr)}</div><div class="tr">${esc(r.tr)}</div>${extra||""}</div>
  <div class="btns"><button class="play" aria-label="Play" data-say="${esc(r.en)}" data-rate="0.9">🔊</button><button class="play slow" aria-label="Slow" data-say="${esc(r.en)}" data-rate="0.6">🐢</button></div></div>`;
}
function chips(el,items,sel,fn){
  el.innerHTML=items.map((t,i)=>`<button aria-pressed="${i===sel}" data-i="${i}">${esc(t)}</button>`).join("");
  el.onclick=e=>{const b=e.target.closest("button"); if(b) fn(+b.dataset.i);};
}
function renderPhrases(){
  const P=DATA[lang].phrases; chips($("cats"),P.map(s=>s.t),cat,i=>{cat=i;renderPhrases();});
  $("list").innerHTML=P[cat].r.map(r=>card(r)).join("");
}
function renderDialogs(){
  const D=DATA[lang].dialogs; chips($("dcats"),D.map(s=>s.t),dcat,i=>{dcat=i;renderDialogs();});
  $("dlist").innerHTML=`<button class="playall" id="playall">${UI[lang].playall}</button>`+D[dcat].r.map(r=>card(r,r.who)).join("");
  $("playall").onclick=()=>{const rows=D[dcat].r; let i=0; const go=()=>{if(i<rows.length){speak(rows[i++].en,0.85,()=>setTimeout(go,500));}}; go();};
}
function pool(){return DATA[lang].phrases.flatMap(s=>s.r).filter(r=>!/\.\.\./.test(r.en));}
function newQ(){
  const p=pool(); const a=p[Math.floor(Math.random()*p.length)];
  const opts=new Set([a.tr]); while(opts.size<4){opts.add(p[Math.floor(Math.random()*p.length)].tr);}
  cur={a,opts:[...opts].sort(()=>Math.random()-.5),done:false}; renderQuiz();
  if(mode===1) speak(a.en,0.85);
}
function renderQuiz(){
  const u=UI[lang];
  chips($("modes"),[u.m1,u.m2],mode-1,i=>{mode=i+1;newQ();});
  if(!cur){newQ();return;}
  const showEn = mode===2 || cur.done;
  $("quiz").innerHTML=`<div class="qhead"><span>${mode===1?u.q1:u.q2}</span><span>${u.score}: ${score}/${total}</span></div>
   <div class="row"><button class="play" data-say="${esc(cur.a.en)}" data-rate="0.85" aria-label="Play">🔊</button><button class="play slow" data-say="${esc(cur.a.en)}" data-rate="0.6" aria-label="Slow">🐢</button></div>
   ${showEn?`<div class="qen">${esc(cur.a.en)}</div><div class="pr">${esc(cur.a.pr)}</div>`:""}
   <div class="opts">${cur.opts.map(o=>`<button data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>
   <div class="fb" id="fb"></div>${cur.done?`<button class="next" id="next">${u.next}</button>`:""}`;
  $("quiz").querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{
    if(cur.done) return; cur.done=true; total++; const right=b.dataset.o===cur.a.tr; if(right) score++;
    renderQuiz();
    $("quiz").querySelectorAll(".opts button").forEach(x=>{ if(x.dataset.o===cur.a.tr) x.classList.add("ok"); else if(x.dataset.o===b.dataset.o) x.classList.add("bad"); });
    $("fb").textContent= right? u.ok : `${u.bad} ${cur.a.tr}`;
    speak(cur.a.en,0.85);
  });

irando?", "pr": "iz rrí brídhin"}, {"who": "B", "en": "Yes, but he is not talking.", "tr": "Sim, mas não está falando.", "pr": "iés bât rrí iz nát tókin"}, {"who": "A", "en": "An ambulance is on the way. Stay on the phone.", "tr": "A ambulância está a caminho. Fique na linha.", "pr": "én émbiulâns iz án dhâ uêi stêi án dhâ fôun"}], "note": ""}], "tips": ["**Primeiro diga o que está acontecendo e o seu endereço.** Se você não fala bem inglês, diga *\"Portuguese, please\"*: o 911 pode conectar um intérprete.", "**Não desligue** até que mandem.", "**Ensine aos seus filhos** o endereço completo e a ligar para o 911.", "**Envenenamento:** a linha gratuita de ajuda é **1-800-222-1222**.", "**Se não for uma emergência,** em muitas cidades você pode ligar para o **311** para pedir informação."], "tree": null}, {"id": "escuela", "n": 5, "t": "A escola dos filhos", "intro": "Frases para falar com a escola, os professores e a secretaria.", "parts": [{"t": "Frases úteis (1/2)", "note": "", "rows": [{"en": "How do I enroll my child in school?", "tr": "Como eu matriculo meu filho na escola?", "pr": "rráu dú ái inrôul mái tcháild in skúl"}, {"en": "I'm Sofia's mother.", "tr": "Sou a mãe da Sofia.", "pr": "áim sôufíâz mâdhâr"}, {"en": "My son is sick today.", "tr": "Meu filho está doente hoje.", "pr": "mái sân iz sik tâdêi"}, {"en": "He can't come to school.", "tr": "Ele não pode ir à escola.", "pr": "rrí ként kâm tú skúl"}, {"en": "What time does school start?", "tr": "Que horas começa a escola?", "pr": "uât táim dâz skúl stárt"}, {"en": "I will pick up my daughter early.", "tr": "Vou buscar minha filha mais cedo.", "pr": "ái uil pik âp mái dótâr ârli"}], "kind": "phrases"}, {"t": "Frases úteis (2/2)", "note": "", "rows": [{"en": "How is my child doing in class?", "tr": "Como meu filho está indo na aula?", "pr": "rráu iz mái tcháild dúin in klés"}, {"en": "Is there homework today?", "tr": "Tem lição de casa hoje?", "pr": "iz dhér rrôumuârk tâdêi"}, {"en": "Can I talk to the teache e está?", "pr": "áim sári uât grêid iz rrí in"}, {"who": "B", "en": "He is in third grade.", "tr": "Ele está no terceiro ano.", "pr": "rrí iz in thârd grêid"}, {"who": "A", "en": "Thank you for calling. I hope he feels better.", "tr": "Obrigada por ligar. Espero que ele melhore.", "pr": "thénk iú fór kólin ái rrôup rrí fílz bétâr"}], "note": ""}], "tips": ["**Avise sempre** a escola quando seu filho faltar, no mesmo dia e cedo.", "**Olhe a mochila** todos os dias: lá vêm bilhetes, autorizações e avisos importantes.", "**Peça um intérprete** para as reuniões na escola. Muitas escolas públicas oferecem de graça.", "**Seus filhos podem ajudar** você a praticar: peça que ensinem uma palavra nova por dia."], "tree": null}, {"id": "gramatica", "n": 6, "t": "Gramática básica: como montar frases", "intro": "As regras mais importantes para falar com frases completas. Sem palavras difíceis: só padrões que se repetem.", "parts": [{"t": "1. Sempre com sujeito", "note": "Em português dizemos *está chovendo* ou *estou com fome* sem dizer quem. Em inglês **sempre** tem sujeito: *I, you, he, she, it, we, they*.", "rows": [{"en": "It is raining.", "tr": "Está chovendo.", "pr": "it iz rêinin"}, {"en": "It is cold.", "tr": "Está frio.", "pr": "it iz kôuld"}, {"en": "I am hungry.", "tr": "Estou com fome.", "pr": "ái ém rrângri"}, {"en": "We are tired.", "tr": "Estamos cansados.", "pr": "uí ár táiârd"}], "kind": "phrases"}, {"t": "2. O verbo to be: ser e estar", "note": "*To be* é **ser** e **estar** ao mesmo tempo: *I am*, *you are*, *he/she/it is*, *we are*, *they are*.", "rows": [{"en": "I am from Mexico.", "tr": "Sou do México.", "pr": "ái ém frâm méksikou"}, {"en": "She is a nurse.", "tr": "Ela é enfermeira.", "pr": "chí iz â nârs"}, {"en": "They are at home.", "tr": "Eles estão em casa.", "pr": "dhêi ár ét rrôum"}, {"en": "I am thirty years old.", "tr": "Tenho trinta anos.", "pr": "ái ém thârti iírz ôuld"}, {"en": "Are you OK?", "tr": "Você está bem?", "pr": "ár iú oukêi"}, {"en": "He is not here.", "tr": "Ele não está aqui.", "pr": "rrí iz nát rrir"}], "kind": "phrases"}, {"t": "3. O presente: rotinas", "note": "Com *he, she, it* o verbo leva **-s**: *I work*, mas *she works*. Para negar: **don't / doesn't** + verbo. Para perguntar: **Do / Does** + sujeito + verbo.", "rows": [{"en": "I work every day.", "tr": "Trabalho todos os dias.", "pr": "ái uârk évri dêi"}, {"en": "She works at a hotel.", "tr": "Ela trabalha em um hotel.", "pr": "chí uârks ét â rroutél"}, {"en": "I don't drive.", "tr": "Eu não dirijo.", "pr": "ái dôunt dráiv"}, {"en": "He doesn't speak English.", "tr": "Ele não fala inglês.", "pr": "rrí dâzânt spík inglich"}, {"en": "Do you have children?", "tr": "Você tem filhos?", "pr": "dú iú rrév tchildrân"}, {"en": "Does she live here?", "tr": "Ela mora aqui?", "pr": "dâz chí liv rrir"}], "kind": "phrases"}, {"t": "4. O passado", "note": "Muitos verbos ganham **-ed**: *work → worked*. Outros mudam: *go → went*, *have → had*, *eat → ate*. Para negar e perguntar se usa **did** e o verbo volta à forma normal.", "rows": [{"en": "I worked yesterday.", "tr": "Trabalhei ontem.", "pr": "ái uârkt iéstârdei"}, {"en": "We went to the store.", "tr": "Fomos à loja.", "pr": "uí uént tú dhâ stór"}, {"en": "I didn't sleep well.", "tr": "Não dormi bem.", "pr": "ái didânt slíp uél"}, {"en": "Did you eat?", "tr": "Você comeu?", "pr": "did iú ít"}], "kind": "phrases"}, {"t": "5. O futuro", "note": "Use **will** + verbo ou **going to** + verbo para falar do futuro.", "rows": [{"en": "I will call you tomorrow.", "tr": "Te ligo amanhã.", "pr": "ái uil kól iú tâmárou"}, {"en": "We are going to move.", "tr": "Vamos nos mudar.", "pr": "uí ár gôuin tú múv"}, {"en": "It's going to rain.", "tr": "Vai chover.", "pr": "its gôuin tú rêin"}], "kind": "phrases"}, {"t": "6. Erros comuns", "note": "", "rows": [{"en": "I am thirty years old.", "tr": "✗ I have thirty years.", "pr": "ái ém thârti iírz ôuld", "bad": true}, {"en": "I agree.", "tr": "✗ I am agree.", "pr": "ái âgrí", "bad": true}, {"en": "It is important.", "tr": "✗ Is important.", "pr": "it iz impórtânt", "bad": true}, {"en": "People are nice.", "tr": "✗ People is nice.", "pr": "pípâl ár náis", "bad": true}, {"en": "a red car", "tr": "✗ a car red", "pr": "â réd kár", "bad": true}, {"en": "Explain it to me, please.", "tr": "✗ Explain me, please.", "pr": "iksplêin it tú mí plíz", "bad": true}], "kind": "mistakes"}, {"t": "O que você fez no fim de semana?", "kind": "dialog", "rows": [{"who": "A", "en": "What did you do this weekend?", "tr": "O que você fez neste fim de semana?", "pr": "uât did iú dú dhis uíkend"}, {"who": "B", "en": "I worked on Saturday. On Sunday I went to the park.", "tr": "Trabalhei no sábado. No domingo fui ao parque.", "pr": "ái uârkt án sétârdei án sândei ái uént tú dhâ párk"}, {"who": "A", "en": "Did you go with your kids?", "tr": "Você foi com seus filhos?", "pr": "did iú gôu uith iór kidz"}, {"who": "B", "en": "Yes. They played soccer.", "tr": "Sim. Eles jogaram futebol.", "pr": "iés dhêi plêid sákâr"}, {"who": "A", "en": "Nice! Are you going to work next weekend?", "tr": "Que legal! Você vai trabalhar no próximo fim de semana?", "pr": "náis ár iú gôuin tú uârk nékst uíkend"}, {"who": "B", "en": "No, I'm not. I'm going to rest.", "tr": "Não. Vou descansar.", "pr": "nôu áim nát áim gôuin tú rést"}], "note": ""}], "tips": ["**Pratique mudando uma palavra só:** *I work → She works → I worked → I will work.*", "**Não se preocupe com os erros.** O importante é que entendam você. A gramática melhora com a prática."], "tree": null}, {"id": "colores", "n": 7, "t": "As cores", "intro": "As cores servem para descrever roupas, carros, casas e muito mais.", "parts": [{"t": "As cores (1/2)", "note": "", "rows": [{"en": "red", "tr": "vermelho", "pr": "réd"}, {"en": "blue", "tr": "azul", "pr": "blú"}, {"en": "yellow", "tr": "amarelo", "pr": "iélou"}, {"en": "green", "tr": "verde", "pr": "grín"}, {"en": "orange", "tr": "laranja", "pr": "órindj"}, {"en": "pur "en": "blond", "tr": "loiro", "pr": "blánd"}, {"en": "dark hair", "tr": "cabelo escuro", "pr": "dárk rrér"}, {"en": "curly hair", "tr": "cabelo cacheado", "pr": "kârli rrér"}, {"en": "straight hair", "tr": "cabelo liso", "pr": "strêit rrér"}, {"en": "beard", "tr": "barba", "pr": "bird"}, {"en": "glasses", "tr": "óculos", "pr": "gléssiz"}], "kind": "words"}, {"t": "Como é por dentro", "note": "", "rows": [{"en": "kind", "tr": "gentil", "pr": "káind"}, {"en": "friendly", "tr": "simpático", "pr": "fréndli"}, {"en": "funny", "tr": "engraçado", "pr": "fâni"}, {"en": "shy", "tr": "tímido", "pr": "chái"}, {"en": "smart", "tr": "inteligente", "pr": "smárt"}, {"en": "hardworking", "tr": "trabalhador", "pr": "rrárduârkin"}, {"en": "honest", "tr": "honesto", "pr": "ánâst"}, {"en": "patient", "tr": "paciente", "pr": "pêichânt"}], "kind": "words"}, {"t": "Como se sente", "note": "", "rows": [{"en": "happy", "tr": "feliz", "pr": "rrépi"}, {"en": "sad", "tr": "triste", "pr": "séd"}, {"en": "angry", "tr": "bravo", "pr": "éngri"}, {"en": "tired", "tr": "cansado", "pr": "táiârd"}, {"en": "nervous", "tr": "nervoso", "pr": "nârvâs"}, {"en": "worried", "tr": "preocupado", "pr": "uârid"}, {"en": "scared", "tr": "com medo", "pr": "skérd"}, {"en": "sick", "tr": "doente", "pr": "sik"}], "kind": "words"}, {"t": "Frases úteis", "note": "", "rows": [{"en": "What does he look like?", "tr": "Como ele é fisicamente?", "pr": "uât dâz rrí lúk láik"}, {"en": "She is tall and friendly.", "tr": "Ela é alta e simpática.", "pr": "chí iz tól énd fréndli"}, {"en": "He has short black hair.", "tr": "Ele tem cabelo curto e preto.", "pr": "rrí rréz chórt blék rrér"}, {"en": "My boss is very kind.", "tr": "Meu chefe é muito gentil.", "pr": "mái bás iz véri káind"}, {"en": "He is about forty years old.", "tr": "Ele tem uns quarenta anos.", "pr": "rrí iz âbáut fórti iírz ôuld"}, {"en": "I'm a little nervous.", "tr": "Estou um pouco nervoso.", "pr": "áim â litâl nârvâs"}], "kind": "phrases"}], "tips": ["**Os adj /* ---------- short lessons ---------- */
let lesOpen=null, lesPart=0, lq=null;
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>");}
function lp(){try{return JSON.parse(localStorage.getItem("ef-les-"+lang)||"{}");}catch(e){return {};}}
function lpSave(p){try{localStorage.setItem("ef-les-"+lang,JSON.stringify(p));}catch(e){}}
function nParts(L){return L.parts.length+1;}
function firstUndone(L,p){const d=p[L.id]||[];for(let i=0;i<nParts(L);i++) if(!d.includes(i)) return i; return null;}
function renderLessons(){
  const u=LS[lang], el=$("view-lessons"), p=lp();
  if(lesOpen){renderLesson();return;}
  const last=p._last && LESSONS.find(x=>x.id===p._last.id);
  const lastPart=last?firstUndone(last,p):null;
  let h=`<h2 style="margin-top:4px">${u.title}</h2><p class="sub">${u.intro}</p>`;
  if(last && lastPart!==null) h+=`<button class="big" id="lcont">${u.cont}: ${esc(last.t)} · ${u.partOf.replace("{i}",lastPart+1).replace("{n}",nParts(last))}</button>`;
  const GH=["🧭 Situações do dia a dia", "📚 Vocabulário"];
  h+=LESSONS.map(L=>{const d=(p[L.id]||[]).length, n=nParts(L), full=d>=n;
    const gh=L.n===1?`<h2>${GH[0]}</h2>`:(L.n===7?`<h2 style="margin-top:22px">${GH[1]}</h2>`:"");
    return gh+`<button class="lcard ${full?"done":""}" data-l="${L.id}"><span class="n">${u.lesson} ${L.n}${full?" · ✓ "+u.doneL:""}</span><b>${esc(L.t)}</b><div class="prog"><i style="width:${Math.min(100,d/n*100)}%"></i></div></button>`;}).join("");
  el.innerHTML=h;
  el.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>openLesson(b.dataset.l));
  const c=$("lcont"); if(c) c.onclick=()=>openLesson(last.id);
}
function openLesson(id,part){const L=LESSONS.find(x=>x.id===id); const p=lp(); lesOpen=id; const f=firstUndone(L,p); lesPart=part!=null?part:(f===null?0:f); lq=null; p._last={id}; lpSave(p); renderLesson(); window.scrollTo(0,0);}
function markPart(L,i){const p=lp(); const d=p[L.id]||[]; if(!d.includes(i)) d.push(i); p[L.id]=d; p._last={id:L.id}; lpSave(p);}
function renderLesson(){
  const u=LS[lang], el=$("view-lessons"), L=LESSONS.find(x=>x.id===lesOpen), p=lp(), d=p[L.id]||[], n=nParts(L);
  let h=`<button class="ghost" id="lback">${u.back}</button><div class="step">${u.lesson} ${L.n} · ${u.partOf.replace("{i}",lesPart+1).replace("{n}",n)} · ${u.min}</div><h2 style="margin-top:2px">${esc(L.t)}</h2>
   <div class="dots">${[...Array(n).keys()].map(i=>`<i class="${d.includes(i)?"on":(i===lesPart?"cur":"")}"></i>`).join("")}</div>`;
  if(lesPart===0) h+=`<p class="sub">${esc(L.intro)}</p>`+(L.tree&&IMGS[L.tree]?`<div class="tree">${IMGS[L.tree]}</div>`:"");
  if(lesPart<L.parts.length){
    const P=L.parts[lesPart];
    h+=`<h2>${esc(P.t)}</h2>`+(P.note?`<div class="lnote">${md(P.note)}</div>`:"");
    if(P.kind==="dialog") h+=`<button class="playall" id="lplay">${UI[lang].playall}</button>`+P.rows.map(r=>card(r,r.who)).join("");
    else if(P.kind==="mistakes") h+=P.rows.map(r=>card({en:"✓ "+r.en,pr:r.pr,tr:""},null,`<div class="bad">${esc(r.tr)}</div>`).replace(`data-say="✓ `,`data-say="`).replace(`data-say="✓ `,`data-say="`)).join("");
    else h+=P.rows.map(r=>card(r)).join("");
    h+=`<button class="big" id="lnext">${lesPart+1<n?u.done:u.done}</button>`;
  } else {
    if(!lq) lq=mkQuiz(L.parts.filter(x=>x.kind!=="mistakes").flatMap(x=>x.rows).filter(r=>!/^\d/.test(r.tr)),5);
    const q=lq.qs[lq.i];
    h+=`<h2>${u.quizT}</h2>`;
    if(q){ h+=`<p class="sub">${u.quizI}</p><div class="quiz"><div class="qhead"><span>${lq.i+1}/${lq.qs.length}</span><span>${UI[lang].score}: ${lq.right}</span></div>
      <div class="row"><button class="play" data-say="${esc(q.a.en)}" data-rate="0.85">🔊</button><button class="play slow" data-say="${esc(q.a.en)}" data-rate="0.6">🐢</button></div>
      ${q.a.img&&IMGS[q.a.img]?`<div class="qpic">${IMGS[q.a.img]}</div>`:""}<div class="qen">${esc(q.a.en)}</div><div class="opts">${q.opts.map(o=>`<button data-o="${esc(o)}" class="${q.pick?(o===q.a.tr?"ok":(o===q.pick?"bad":"")):""}">${esc(o)}</button>`).join("")}</div>
      <div class="fb">${q.pick?(q.pick===q.a.tr?UI[lang].ok:UI[lang].bad+" "+esc(q.a.tr)):""}</div>${q.pick?`<button class="next" id="lqn">${UI[lang].next}</button>`:""}</div>`; }
    else { markPart(L,lesPart); h+=`<div class="quiz"><div class="qen">${lq.right}/${lq.qs.length} ⭐</div><div class="challenge">${u.fin}</div></div>
      <h2>${u.tips}</h2><ul class="tipl">${L.tips.map(t=>`<li>${md(t)}</li>`).join("")}</ul>
      <button class="big" id="lhome" style="margin-top:16px">${u.back}</button><button class="ghost" id="lagain">${u.again}</button>`; }
  }
  el.innerHTML=h;
  $("lback").onclick=()=>{lesOpen=null;renderLessons();window.scrollTo(0,0);};
  const pl=$("lplay"); if(pl) pl.onclick=()=>{const rows=L.parts[lesPart].rows;let i=0;const go=()=>{if(i<rows.length)speak(rows[i++].en,0.85,()=>setTimeout(go,500));};go();};
  const nx=$("lnext"); if(nx) nx.onclick=()=>{markPart(L,lesPart); lesPart++; renderLesson(); window.scrollTo(0,0);};
  if(lq){const q=lq.qs[lq.i]; if(q&&!q.pick) el.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{q.pick=b.dataset.o; if(q.pick===q.a.tr) lq.right++; speak(q.a.en,0.85); renderLesson();});}
  const qn=$("lqn"); if(qn) qn.onclick=()=>{lq.i++; renderLesson();};
  const hm=$("lhome"); if(hm) hm.onclick=()=>{lesOpen=null;renderLessons();window.scrollTo(0,0);};
  const ag=$("lagain"); if(ag) ag.onclick=()=>{const p2=lp(); p2[L.id]=[]; lpSave(p2); openLesson(L.id,0);};
}

/* ---------- read any word ---------- */
let readText="";
const TRY=["night","station","knife","phone","computer","delicious","beach","purple","careful","highway"];
function soundFor(p){ const b=p.replace("1",""); return SOUNDS[lang].find(s=>s.ph&&s.ph.includes(b)); }
function renderRead(){
  const u=UI[lang], T=TIPS[lang], el=$("view-read");
  const words=readText.trim().split(/\s+/).filter(Boolean).slice(0,8);
  let res="";
  if(words.length){
    const full=ENG.pronounceText(words.join(" "),lang);
    res+=`<div class="res"><div class="en">${esc(words.join(" "))}</div><div class="big2">${esc(full)}</div>
      <div class="row"><button class="play" data-say="${esc(words.join(" "))}" data-rate="0.85">🔊</button><button class="play slow" data-say="${esc(words.join(" "))}" data-rate="0.55">🐢</button></div>
      <p class="sub" style="margin:10px 0 0">${u.rnote}</p></div>`;
    words.forEach(wd=>{
      const a=ENG.analyze(wd); if(!a) return;
      res+=`<div class="res"><div class="row" style="justify-content:space-between"><div><div class="en">${esc(wd)}</div><div class="pr">${esc(ENG.render(ENG.flat(a.chunks),lang))}</div></div><button class="play" data-say="${esc(wd)}" data-rate="0.75">🔊</button></div>`;
      if(a.irregular){ const nn=[...new Set(a.chunks[0].ph.map(soundFor).filter(Boolean))]; res+=`<div class="irr">⚠ ${T.irregular}</div>${nn.length?`<div class="t" style="margin-top:8px">${nn.map(n=>`<button class="nw" data-snd="${n.id}">${u.newl}: ${esc(n.name)} →</button>`).join(" ")}</div>`:""}`; }
      else{
        res+=`<div class="step" style="margin-top:10px">${u.parts}</div><div class="chunks">`;
        a.chunks.forEach(ch=>{
          const s=ch.ph.length?(ch.g==="n"&&ch.ph[0]==="NG"?"n":ENG.render(ch.ph,lang)):u.mute;
          const tip=T[ch.tag]||"";
          const news=[...new Set(ch.ph.map(soundFor).filter(Boolean))];
          res+=`<div class="ck"><b>${esc(ch.g)}</b><span>→</span><span class="s">${esc(s)}</span>${tip||news.length?`<div class="t">${tip}${news.map(n=>` <button class="nw" data-snd="${n.id}">${u.newl}: ${esc(n.name)} →</button>`).join("")}</div>`:""}</div>`;
        });
        res+=`</div>`;
      }
      res+=`</div>`;
    });
  }
  el.innerHTML=`<h2 style="margin-top:4px">${u.rtitle}</h2><p class="sub">${u.rintro2}</p>
   <form class="inp" id="rform"><input id="rin" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="${u.ph}" value="${esc(readText)}"><button>${u.go}</button></form>
   ${words.length?"":`<div class="sub">${u.try}</div><div class="exs" style="margin-bottom:12px">${TRY.map(w=>`<button class="ex" data-try="${w}">${w}</button>`).join("")}</div>`}
   ${res}`;
  $("rform").onsubmit=e=>{e.preventDefault(); readText=$("rin").value; renderRead(); const w=readText.trim(); if(w) speak(w,0.85);};
  el.querySelectorAll("[data-try]").forEach(b=>b.onclick=()=>{readText=b.dataset.try; renderRead(); speak(readText,0.85);});
  el.querySelectorAll("[data-snd]").forEach(b=>b.onclick=()=>{goSound(b.dataset.snd);});
}
function goSound(id){ tab="sounds"; render(); const c=document.getElementById("snd-"+id); if(c){ c.scrollIntoView({behavior:"smooth",block:"center"}); c.classList.add("flash"); } }
function renderSounds(){
  const u=UI[lang], el=$("view-sounds");
  el.innerHTML=`<h2 style="margin-top:4px">${u.stitle}</h2><p class="sub">${u.sintro}</p>`+SOUNDS[lang].map(s=>`<div class="snd ${s.easy?"easy":""}" id="snd-${s.id}"><div class="badge" style="${s.easy?"":"color:var(--accent)"}">${s.easy?u.easyl:u.newl}</div><h3>${esc(s.name)}</h3><p>${esc(s.how)}</p>
    <div class="exs">${s.ex.map(w=>`<button class="ex" data-say="${esc(w)}" data-rate="0.75">🔊 <span>${esc(w)}</span> <i>${esc(ENG.pronounceText(w,lang))}</i></button>`).join("")}</div></div>`).join("");
}

/* ---------- 30-day course ---------- */
const REVIEW=[7,14,21,28,30];
const DLG_DAY={6:3,12:5,17:1,23:0,25:2,26:4};
function plan(){
  const all=DATA[lang].phrases.flatMap(s=>s.r);
  const learn=[]; for(let d=1;d<=30;d++) if(!REVIEW.includes(d)) learn.push(d);
  const per=Math.ceil(all.length/learn.length), days={};
  learn.forEach((d,i)=>{days[d]={type:"learn",items:all.slice(i*per,(i+1)*per)};});
  REVIEW.forEach(d=>{const prev=learn.filter(x=>x<d&&x>d-(d===30?30:7)).flatMap(x=>days[x].items);days[d]={type:"review",items:prev};});
  for(const d in days){ if(!days[d].items.length) days[d].items=all.slice(0,5); }
  return days;
}
function getDone(){try{return JSON.parse(localStorage.getItem("ef-done-"+lang)||"[]");}catch(e){return [];}}
function setDone(a){try{localStorage.setItem("ef-done-"+lang,JSON.stringify(a));}catch(e){}}
let openDay=null, dq=null;
function renderCourse(){
  const u=UI[lang], el=$("view-course"), done=getDone();
  if(openDay){renderDay();return;}
  const nextDay=[...Array(30).keys()].map(i=>i+1).find(d=>!done.includes(d))||null;
  el.innerHTML=`<h2 style="margin-top:4px">${u.ctitle}</h2><p class="sub">${u.cintro}</p>
   <div class="prog"><i style="width:${done.length/30*100}%"></i></div>
   <div class="sub">${done.length}/30 ${u.complete}</div>
   ${nextDay?`<button class="big" id="go">${done.length?u.cont+" "+nextDay:u.start+" 1"} →</button>`:`<div class="challenge">${u.fin}</div>`}
   <div class="days">${[...Array(30).keys()].map(i=>{const d=i+1;return `<button class="day ${done.includes(d)?"done":""} ${REVIEW.includes(d)?"rev":""} ${d===nextDay?"next":""}" data-d="${d}">${done.includes(d)?"✓":d}</button>`}).join("")}</div>
   <div class="legend">${u.legend}</div>
   <a class="docs" href="${u.docsUrl}" target="_blank" rel="noopener"><b>${u.docs}</b><span>${u.docsSub}</span></a>
   <button class="ghost" id="reset" style="margin-top:14px">${u.reset}</button>`;
  el.querySelectorAll(".day").forEach(b=>b.onclick=()=>{openDay=+b.dataset.d;dq=null;renderCourse();window.scrollTo(0,0);});
  const g=$("go"); if(g) g.onclick=()=>{openDay=nextDay;dq=null;renderCourse();window.scrollTo(0,0);};
  $("reset").onclick=()=>{ if($("reset").dataset.sure){setDone([]);renderCourse();} else {$("reset").dataset.sure=1;$("reset").textContent="⚠ "+u.reset+"?";} };
}
function mkQuiz(items,n){
  const P=pool(); const pick=[...items].filter(r=>!/\.\.\./.test(r.en)).sort(()=>Math.random()-.5).slice(0,n);
  return {qs:pick.map(a=>{const o=new Set([a.tr]);let g=0;while(o.size<4&&g++<200)o.add(P[Math.floor(Math.random()*P.length)].tr);return {a,opts:[...o].sort(()=>Math.random()-.5),pick:null};}),i:0,right:0};
}
function renderDay(){
  const u=UI[lang], el=$("view-course"), days=plan(), D=days[openDay], done=getDone();
  if(!dq) dq=mkQuiz(D.items, D.type==="review"?8:3);
  let html=`<button class="ghost" id="back">${u.back}</button><h2 style="margin-top:0">${u.day} ${openDay}${D.type==="review"?" · "+u.review:""}</h2>`;
  if(D.type==="learn"){
    html+=`<div class="step">${u.s1}</div><p class="sub">${u.s1b}</p>`+D.items.map((r,k)=>card(r,null,`<button class="said" data-k="${k}" aria-pressed="false">${u.said}</button>`)).join("");
    if(DLG_DAY[openDay]!==undefined){const dl=DATA[lang].dialogs[DLG_DAY[openDay]]; html+=`<div class="step" style="margin-top:14px">${u.dlg}</div><h2>${esc(dl.t)}</h2><button class="playall" id="dplay">${u.playall}</button>`+dl.r.map(r=>card(r,r.who)).join("");}
    html+=`<div class="step" style="margin-top:14px">${u.s2}</div>`;
  } else html+=`<p class="sub">${u.rintro}</p>`;
  const q=dq.qs[dq.i];
  if(q){
    html+=`<div class="quiz"><div class="qhead"><span>${dq.i+1}/${dq.qs.length}</span><span>${u.score}: ${dq.right}</span></div>
      <div class="row"><button class="play" data-say="${esc(q.a.en)}" data-rate="0.85">🔊</button><button class="play slow" data-say="${esc(q.a.en)}" data-rate="0.6">🐢</button></div>
      <div class="qen">${esc(q.a.en)}</div>
      <div class="opts">${q.opts.map(o=>`<button data-o="${esc(o)}" class="${q.pick?(o===q.a.tr?"ok":(o===q.pick?"bad":"")):""}">${esc(o)}</button>`).join("")}</div>
      <div class="fb">${q.pick?(q.pick===q.a.tr?u.ok:u.bad+" "+esc(q.a.tr)):""}</div>${q.pick?`<button class="next" id="qnext">${u.next}</button>`:""}</div>`;
  } else {
    const ch=D.items[Math.floor(openDay*7)%D.items.length];
    html+=`<div class="quiz"><div class="qen">${dq.right}/${dq.qs.length} ⭐</div></div>
      ${D.type==="learn"?`<div class="step" style="margin-top:14px">${u.s3}</div><div class="challenge">${u.chal}<div class="en" style="margin-top:8px">${esc(ch.en)}</div><div class="pr">${esc(ch.pr)}</div></div>`:""}
      ${done.includes(openDay)?`<div class="challenge">${u.done}</div><button class="next" id="again">${u.again}</button>`:`<button class="big" id="finish">${u.finish}</button>`}`;
  }
  el.innerHTML=html;
  $("back").onclick=()=>{openDay=null;renderCourse();};
  el.querySelectorAll(".said").forEach(b=>b.onclick=()=>b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true"));
  const dp=$("dplay"); if(dp) dp.onclick=()=>{const rows=DATA[lang].dialogs[DLG_DAY[openDay]].r;let i=0;const go=()=>{if(i<rows.length)speak(rows[i++].en,0.85,()=>setTimeout(go,500));};go();};
  if(q && !q.pick) el.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>{q.pick=b.dataset.o; if(q.pick===q.a.tr) dq.right++; speak(q.a.en,0.85); renderDayKeep();});
  const qn=$("qnext"); if(qn) qn.onclick=()=>{dq.i++; renderDayKeep();};
  const f=$("finish"); if(f) f.onclick=()=>{const d=getDone(); if(!d.includes(openDay)) d.push(openDay); setDone(d); renderDayKeep();};
  const a=$("again"); if(a) a.onclick=()=>{dq=null; renderCourse(); window.scrollTo(0,0);};
}
function renderDayKeep(){const y=window.scrollY; const saids=[...document.querySelectorAll(".said")].map(b=>b.getAttribute("aria-pressed")); renderDay(); document.querySelectorAll(".said").forEach((b,i)=>{if(saids[i])b.setAttribute("aria-pressed",saids[i]);}); window.scrollTo(0,y);}

function render(){
  const u=UI[lang]; document.documentElement.lang=lang;
  document.querySelector(".seg").classList.toggle("hidden",!!locked);
  $("title").textContent=u.title; $("subtitle").textContent=u.subtitle; $("noaudio").textContent=u.noaudio;
  $("tab-course").textContent=u.course; $("tab-lessons").textContent=LS[lang].tab; $("tab-read").textContent=u.read; $("tab-sounds").textContent=u.sounds; $("tab-phrases").textContent=u.phrases; $("tab-dialogs").textContent=u.dialogs; $("tab-quiz").textContent=u.quiz;
  $("lang-es").setAttribute("aria-pressed",lang==="es"); $("lang-pt").setAttribute("aria-pressed",lang==="pt");
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  ["course","lessons","read","sounds","phrases","dialogs","quiz"].forEach(t=>$("view-"+t).classList.toggle("hidden",t!==tab));
  if(tab==="course") renderCourse(); else if(tab==="lessons") renderLessons(); else if(tab==="read") renderRead(); else if(tab==="sounds") renderSounds(); else if(tab==="phrases") renderPhrases(); else if(tab==="dialogs") renderDialogs(); else renderQuiz();
}
function setLang(l){lang=l; cur=null; openDay=null; dq=null; score=0; total=0; try{localStorage.setItem("ef-lang",l);}catch(e){} render();}
window.addEventListener("hashchange",()=>{const old=lang; readHash(); if(locked&&locked!==old) setLang(locked); else render();});
$("lang-es").onclick=()=>setLang("es"); $("lang-pt").onclick=()=>setLang("pt");
document.querySelector("nav").onclick=e=>{const b=e.target.closest("button"); if(b){tab=b.dataset.tab; if(synth) synth.cancel(); render();}};
document.addEventListener("click",e=>{const b=e.target.closest("[data-say]"); if(b) speak(b.dataset.say,+b.dataset.rate);});
if(!synth) $("noaudio").classList.remove("hidden");
(function(){const st=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;let dis=false;try{dis=localStorage.getItem('ef-inst-x')==='1'}catch(e){}
 if(!st&&!dis)$("inst").classList.remove("hidden");
 let dp=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$("instgo").classList.remove("hidden");});
 $("instgo").onclick=()=>{if(dp){dp.prompt();dp=null;$("inst").classList.add("hidden");}};
 $("instx").onclick=()=>{$("inst").classList.add("hidden");try{localStorage.setItem('ef-inst-x','1')}catch(e){}};})();
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
